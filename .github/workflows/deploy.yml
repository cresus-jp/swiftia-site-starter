# Cloudflare Pages への Direct Upload デプロイ（Swiftia 公開サイトパイプライン）
#
# PAGES_PROJECT_NAME（Actions Variable）と CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# （Actions Secret）は、CMS 管理画面の「公開サイト作成」時に自動注入される。
# 手動デプロイは Actions タブの Run workflow（workflow_dispatch）から実行できる。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一ブランチへのデプロイを1本に絞る。
# サイト構築時は template からのリポジトリ生成（push）と CMS からの workflow_dispatch が
# ほぼ同時刻に走るため、直列化しないと同じ Pages プロジェクトへの並行デプロイになり
# 片方が「Failed to publish your Function」で必ず失敗する。
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ vars.PAGES_PROJECT_NAME }}
